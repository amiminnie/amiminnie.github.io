<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>amiminnie - article editor</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <link rel="stylesheet" href="/assets/styles/dark.css" id="theme-style" />
        <link rel="stylesheet" href="/assets/styles/style.css" id="production-style" />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Alata&family=Overlock:ital,wght@0,400;0,700;0,900;1,400;1,700;1,900&display=swap"
            rel="stylesheet" />
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    </head>
    <body>
        <button class="editor-floating-btn btn" onclick="toggleSettingsModal()">
            <i class="bi bi-gear"></i>
        </button>

        <div class="settings-modal" id="settings-modal">
            <div class="modal-content surface">
                <div class="modal-header">
                    <h2>Settings Panel</h2>
                    <button class="close-modal-btn btn" onclick="toggleSettingsModal()"><i class="bi bi-x"></i></button>
                </div>

                <label style="color: var(--accent); margin-bottom: -5px">ARTICLE SETTINGS</label>
                <label>Article ID (Tag)</label>
                <input type="text" id="article-tag" placeholder="my-post" class="txtarea" />
                <label style="color: var(--accent); margin-bottom: -5px">Metadata</label>
                <label>Thumbnail</label>
                <div class="btn">
                    <input type="text" id="thumb-url" placeholder="images/thumbnail.png" class="txtarea" />
                    <button
                        class="action-btn btn"
                        onclick="handleUpload((url) => document.getElementById('thumb-url').value = url)">
                        <i class="bi bi-upload"></i>
                    </button>
                </div>
                <label>Description</label>
                <textarea
                    id="short-desc"
                    rows="3"
                    placeholder="what it is all about!"
                    class="txtarea"
                    style="margin-bottom: 10px"></textarea>
                <button class="publish-btn btnsoft" id="publish-btn" onclick="publishToSupabase()">
                    <i class="bi bi-floppy-fill"></i> Save
                </button>
            </div>
        </div>

        <div id="formatting-toolbar" class="formatting-toolbar">
            <button onclick="formatText('bold')" title="Bold" class="btn">
                <i class="bi bi-type-bold"></i>
            </button>
            <button onclick="formatText('italic')" title="Italic" class="btn">
                <i class="bi bi-type-italic"></i>
            </button>
            <button onclick="formatText('underline')" title="Underline" class="btn">
                <i class="bi bi-type-underline"></i>
            </button>
            <button onclick="formatText('strikeThrough')" title="Strikethrough" class="btn">
                <i class="bi bi-type-strikethrough"></i>
            </button>
            <button onclick="formatLink()" title="Hyperlink" class="btn">
                <i class="bi bi-link-45deg"></i>
            </button>
            <button onclick="formatText('removeFormat')" title="Clear Formatting" class="btn">
                <i class="bi bi-x"></i>
            </button>
        </div>

        <div class="preview-pane" onclick="handleCanvasClick(event)">
            <div class="container">
                <header>
                    <nav>
                        <a href="/" onclick="event.preventDefault();">about</a>
                        <a href="/archive" onclick="event.preventDefault();">archive</a>
                        <a href="/articles">articles</a>
                        <a href="" onclick="event.preventDefault();" class="active">builder</a>
                    </nav>
                </header>

                <main>
                    <article class="thought-content">
                        <h1
                            contenteditable="true"
                            id="canvas-title"
                            class="wysiwyg-editor"
                            placeholder="Title here"></h1>
                        <p>
                            <em
                                contenteditable="true"
                                id="canvas-date"
                                class="wysiwyg-editor"
                                placeholder="go on a date..."></em>
                        </p>

                        <div id="blocks-container"></div>

                        <div style="margin-top: 20px">
                            <div class="quick-insert-container">
                                <button onclick="addBlock('p')" class="btn" title="Paragraph">
                                    <i class="bi bi-text-left"></i>
                                </button>
                                <button onclick="addBlock('h2')" class="btn" title="Header 2">
                                    <i class="bi bi-type-h2"></i>
                                </button>
                                <button onclick="addBlock('h3')" class="btn" title="Header 3">
                                    <i class="bi bi-type-h3"></i>
                                </button>
                                <button onclick="addBlock('img')" class="btn" title="Standalone Image">
                                    <i class="bi bi-image"></i>
                                </button>
                                <button onclick="addBlock('conversation')" class="btn" title="Quote/Dialogue">
                                    <i class="bi bi-quote"></i>
                                </button>
                                <button onclick="addBlock('ul')" class="btn" title="List">
                                    <i class="bi bi-list-ul"></i>
                                </button>
                                <button onclick="addBlock('split')" class="btn" title="Flexible Split Layout">
                                    <i class="bi bi-layout-split"></i>
                                </button>
                                <button onclick="addBlock('hr')" class="btn" title="Divider">
                                    <i class="bi bi-reception-0"></i>
                                </button>
                                <button onclick="addBlock('html')" class="btn" title="Custom HTML">
                                    <i class="bi bi-filetype-html"></i>
                                </button>
                            </div>
                        </div>
                    </article>
                </main>

                <footer>
                    <p>
                        hosted by <a href="https://supabase.com" target="_blank" rel="noopener noreferrer">Supabase</a>
                    </p>
                    <p>amiminnie</p>
                </footer>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

        <script>
            const SUB_URL = "https://miwcmqwhudshgetmrmhf.supabase.co";
            const ANON_KEY = "sb_publishable_stheDa15dO1UIajFAVSHmw_hKuIf4GZ";
            const supabaseClient = supabase.createClient(SUB_URL, ANON_KEY);

            let blocks = [];
            let activeTargetInfo = null; // null = main canvas, or { splitId, colIndex }

            function toggleSettingsModal() {
                const modal = document.getElementById("settings-modal");
                modal.classList.toggle("open");
            }

            window.onclick = function (event) {
                const modal = document.getElementById("settings-modal");
                if (event.target === modal) {
                    modal.classList.remove("open");
                }
            };

            function handleCanvasClick(e) {
                // Deselect active column if user clicks outside of any nested column
                if (
                    !e.target.closest(".nested-column") &&
                    !e.target.closest(".quick-insert-container") &&
                    !e.target.closest("#target-bar-indicator") &&
                    !e.target.closest(".block-controls")
                ) {
                    if (activeTargetInfo !== null) {
                        activeTargetInfo = null;
                        document
                            .querySelectorAll(".nested-column")
                            .forEach((el) => el.classList.remove("selected-column"));
                    }
                }
            }

            document.addEventListener("selectionchange", handleSelection);

            function handleSelection() {
                const selection = window.getSelection();
                const toolbar = document.getElementById("formatting-toolbar");

                if (!selection || selection.isCollapsed || !selection.toString().trim()) {
                    toolbar.style.display = "none";
                    return;
                }

                let node = selection.anchorNode;
                let withinEditor = false;
                while (node) {
                    if (node.nodeType === Node.ELEMENT_NODE && node.hasAttribute("contenteditable")) {
                        withinEditor = true;
                        break;
                    }
                    node = node.parentNode;
                }

                if (!withinEditor) {
                    toolbar.style.display = "none";
                    return;
                }

                const range = selection.getRangeAt(0);
                const rect = range.getBoundingClientRect();

                toolbar.style.display = "flex";
                toolbar.style.left = `${rect.left + window.scrollX + rect.width / 2 - toolbar.offsetWidth / 2}px`;
                toolbar.style.top = `${rect.top + window.scrollY - toolbar.offsetHeight - 8}px`;
            }

            function formatText(command, value = null) {
                document.execCommand(command, false, value);
                const activeEl = document.activeElement;
                if (activeEl && activeEl.hasAttribute("contenteditable")) {
                    const event = new Event("input", { bubbles: true });
                    activeEl.dispatchEvent(event);
                }
            }

            function formatLink() {
                const url = prompt("Enter link URL:", "https://");
                if (url) {
                    formatText("createLink", url);
                }
            }

            function createNewBlockObject(type, content = "", url = "", alt = "", styles = null) {
                const id = Date.now() + Math.random();
                const defaultStyles = styles || {
                    fontSize: "",
                    color: "",
                    bgColor: "",
                    textAlign: "left",
                    customCss: ""
                };

                if (type === "conversation" && !content) {
                    content =
                        "<p><i>The dozen may be one of the earliest primitive integer groupings... <strong>Twelve is convenient because it has a maximal number of divisors...</strong></i></p>";
                }

                if (type === "split") {
                    return {
                        id,
                        type,
                        gridCols: "1fr 1fr",
                        columns: [[], []],
                        styles: defaultStyles,
                        showStyles: false
                    };
                }

                return {
                    id,
                    type,
                    v1: content,
                    url: url,
                    alt: alt,
                    isEditingHtml: false,
                    styles: defaultStyles,
                    showStyles: false
                };
            }

            function getActiveTargetArray() {
                if (!activeTargetInfo) return blocks;
                const splitBlock = findBlockById(activeTargetInfo.splitId);
                if (splitBlock && splitBlock.columns && splitBlock.columns[activeTargetInfo.colIndex]) {
                    return splitBlock.columns[activeTargetInfo.colIndex];
                }
                activeTargetInfo = null;
                return blocks;
            }

            function addBlock(type) {
                const targetArray = getActiveTargetArray();
                const newBlock = createNewBlockObject(type);
                targetArray.push(newBlock);
                renderEditor();
            }

            function removeBlockById(id, targetArray = blocks) {
                const index = targetArray.findIndex((b) => b.id === id);
                if (index !== -1) {
                    targetArray.splice(index, 1);
                    return true;
                }
                for (let b of targetArray) {
                    if (b.type === "split" && b.columns) {
                        for (let col of b.columns) {
                            if (removeBlockById(id, col)) return true;
                        }
                    }
                }
                return false;
            }

            function findBlockById(id, targetArray = blocks) {
                for (let b of targetArray) {
                    if (b.id === id) return b;
                    if (b.type === "split" && b.columns) {
                        for (let col of b.columns) {
                            const found = findBlockById(id, col);
                            if (found) return found;
                        }
                    }
                }
                return null;
            }

            function findParentArrayAndIndex(id, targetArray = blocks) {
                for (let i = 0; i < targetArray.length; i++) {
                    let b = targetArray[i];
                    if (b.id === id) {
                        return { parentArray: targetArray, index: i };
                    }
                    if (b.type === "split" && b.columns) {
                        for (let col of b.columns) {
                            let found = findParentArrayAndIndex(id, col);
                            if (found) return found;
                        }
                    }
                }
                return null;
            }

            function moveBlock(id, direction, steps = 1) {
                const found = findParentArrayAndIndex(id);
                if (!found) return;

                const { parentArray, index } = found;
                let newIndex = direction === "up" ? index - steps : index + steps;

                if (newIndex < 0) newIndex = 0;
                if (newIndex >= parentArray.length) newIndex = parentArray.length - 1;

                if (newIndex !== index) {
                    const [item] = parentArray.splice(index, 1);
                    parentArray.splice(newIndex, 0, item);
                    renderEditor();
                }
            }

            function duplicateBlock(id) {
                const found = findParentArrayAndIndex(id);
                if (!found) return;

                const { parentArray, index } = found;
                const clonedBlock = JSON.parse(JSON.stringify(parentArray[index]));
                function assignNewIds(block) {
                    block.id = Date.now() + Math.random();
                    if (block.type === "split" && block.columns) {
                        block.columns.forEach((col) => col.forEach(assignNewIds));
                    }
                }
                assignNewIds(clonedBlock);
                parentArray.splice(index + 1, 0, clonedBlock);
                renderEditor();
            }

            function toggleBlockStyles(id) {
                const b = findBlockById(id);
                if (b) {
                    b.showStyles = !b.showStyles;
                    renderEditor();
                }
            }

            function updateBlockStyleLive(id, prop, value) {
                const b = findBlockById(id);
                if (!b) return;
                if (!b.styles) b.styles = {};
                b.styles[prop] = value;

                const el = document.getElementById(`block-content-${id}`);
                if (el) applyStylesToElement(el, b.styles);

                if (prop === "fontSize") {
                    const label = document.getElementById(`lbl-size-${id}`);
                    if (label) label.innerText = `${value}rem`;
                }
            }

            function applyStylesToElement(el, styles) {
                if (!styles || !el) return;
                el.style.fontSize = styles.fontSize ? `${styles.fontSize}rem` : "";
                el.style.color = styles.color || "";
                el.style.backgroundColor = styles.bgColor || "";
                el.style.textAlign = styles.textAlign || "";

                let inlineStyle = el.getAttribute("style") || "";
                if (styles.customCss) {
                    el.style.cssText = inlineStyle + "; " + styles.customCss;
                }
            }

            function getBlockStyleString(b) {
                if (!b.styles) return "";
                let style = "";
                if (b.styles.fontSize) style += `font-size: ${b.styles.fontSize}rem; `;
                if (b.styles.color) style += `color: ${b.styles.color}; `;
                if (b.styles.bgColor) style += `background-color: ${b.styles.bgColor}; `;
                if (b.styles.textAlign && b.styles.textAlign !== "left") style += `text-align: ${b.styles.textAlign}; `;
                if (b.styles.customCss) style += `${b.styles.customCss}; `;
                return style.trim() ? ` style="${style.trim()}"` : "";
            }

            async function ensureAuthenticated() {
                const {
                    data: { session }
                } = await supabaseClient.auth.getSession();
                if (!session) {
                    alert("You must be logged in as an admin to perform this action.");
                    window.location.href = "/login";
                    return false;
                }
                return true;
            }

            async function handleUpload(onSuccess) {
                if (!(await ensureAuthenticated())) return;

                const fileInput = document.createElement("input");
                fileInput.type = "file";
                fileInput.accept = "image/*";

                fileInput.onchange = async (e) => {
                    const file = e.target.files[0];
                    if (!file) return;

                    const fileName = `${Date.now()}-${file.name.replace(/\s/g, "_")}`;
                    const { data, error } = await supabaseClient.storage.from("blog-assets").upload(fileName, file);

                    if (error) {
                        alert("Upload failed: " + error.message);
                    } else {
                        const publicUrl = `${SUB_URL}/storage/v1/object/public/blog-assets/${fileName}`;
                        onSuccess(publicUrl);
                    }
                };
                fileInput.click();
            }

            function toggleHtmlEdit(id) {
                const b = findBlockById(id);
                if (b) {
                    b.isEditingHtml = !b.isEditingHtml;
                    renderEditor();
                }
            }

            function selectColumn(splitId, colIndex, event) {
                if (event) event.stopPropagation();

                if (
                    activeTargetInfo &&
                    activeTargetInfo.splitId === splitId &&
                    activeTargetInfo.colIndex === colIndex
                ) {
                    return;
                }

                activeTargetInfo = { splitId, colIndex };

                document.querySelectorAll(".nested-column").forEach((el) => el.classList.remove("selected-column"));
                if (event && event.currentTarget) {
                    event.currentTarget.classList.add("selected-column");
                } else {
                    renderEditor();
                }
            }

            function deselectColumn() {
                activeTargetInfo = null;
                renderEditor();
            }

            function buildBlockElement(b, parentArray) {
                const wrapper = document.createElement("div");
                wrapper.className = "block-wrapper";

                const controls = document.createElement("div");
                controls.className = "block-controls";
                controls.innerHTML = `
    <button onclick="moveBlock(${b.id}, 'up', 10)" title="Move Up 10" class="btn"><i class="bi bi-chevron-double-up"></i></button>
    <button onclick="moveBlock(${b.id}, 'up', 1)" title="Move Up" class="btn"><i class="bi bi-chevron-up"></i></button>
    <button onclick="moveBlock(${b.id}, 'down', 1)" title="Move Down" class="btn"><i class="bi bi-chevron-down"></i></button>
    <button onclick="moveBlock(${b.id}, 'down', 10)" title="Move Down 10" class="btn"><i class="bi bi-chevron-double-down"></i></button>
    <button onclick="duplicateBlock(${b.id})" title="Duplicate Block" class="btn"><i class="bi bi-copy"></i></button>
    <button onclick="toggleBlockStyles(${b.id})" title="Toggle Styles" class="btn"><i class="bi bi-palette"></i></button>
    <button onclick="removeBlockById(${b.id}); renderEditor();" title="Delete Block" class="btn"><i class="bi bi-trash3"></i></button>
`;
                wrapper.appendChild(controls);

                if (b.showStyles) {
                    const stylesPanel = document.createElement("div");
                    stylesPanel.className = "block-styles-panel surface";
                    const currentSize = b.styles?.fontSize || "1.0";
                    const currentColor = b.styles?.color || "#ffffff";
                    const currentBg = b.styles?.bgColor || "#000000";
                    const currentAlign = b.styles?.textAlign || "left";
                    const currentCss = b.styles?.customCss || "";

                    let splitControls = "";
                    if (b.type === "split") {
                        const currentGrid = b.gridCols || "1fr 1fr";
                        splitControls = `
                            <div class="style-group" style="flex-grow:1; border-top: 1px solid var(--accent); padding-top: 10px; margin-top: 5px;">
                                <label>Layout Widths (e.g. 1fr 1fr, 300px 1fr, 40% 60%)</label>
                                <input type="text" class="txtarea" onchange="findBlockById(${b.id}).gridCols = this.value; renderEditor();" value="${currentGrid}" style="width:100%;" />
                            </div>
                        `;
                    }

                    stylesPanel.innerHTML = `
                        <div class="style-group">
                            <label>Size (<span id="lbl-size-${b.id}">${currentSize}rem</span>)</label>
                            <input type="range" min="0.5" max="3.5" step="0.1" value="${currentSize}" oninput="updateBlockStyleLive(${b.id}, 'fontSize', this.value)" />
                        </div>
                        <div class="style-group">
                            <label>Text</label>
                            <input type="color" value="${currentColor}" oninput="updateBlockStyleLive(${b.id}, 'color', this.value)" title="Text Color" />
                        </div>
                        <div class="style-group">
                            <label>BG</label>
                            <input type="color" value="${currentBg}" oninput="updateBlockStyleLive(${b.id}, 'bgColor', this.value)" title="Background Color" />
                        </div>
                        <div class="style-group">
                            <div class="align-btn-group">
                                <button class="align-btn ${currentAlign === "left" ? "active" : ""} btn" onclick="updateBlockStyleLive(${b.id}, 'textAlign', 'left'); renderEditor();" title="Align Left"><i class="bi bi-text-left"></i></button>
                                <button class="align-btn ${currentAlign === "center" ? "active" : ""} btn" onclick="updateBlockStyleLive(${b.id}, 'textAlign', 'center'); renderEditor();" title="Align Center"><i class="bi bi-text-center"></i></button>
                                <button class="align-btn ${currentAlign === "right" ? "active" : ""} btn" onclick="updateBlockStyleLive(${b.id}, 'textAlign', 'right'); renderEditor();" title="Align Right"><i class="bi bi-text-right"></i></button>
                            </div>
                        </div>
                        <div class="style-group" style="flex-grow:1;">
                            <label>Custom CSS</label>
                            <input type="text" class="txtarea" value="${currentCss}" oninput="updateBlockStyleLive(${b.id}, 'customCss', this.value)" style="width:100%;" />
                        </div>
                        ${splitControls}
                    `;
                    wrapper.appendChild(stylesPanel);
                }

                let contentNode;

                if (b.type === "p") {
                    contentNode = document.createElement("p");
                    contentNode.className = "wysiwyg-editor";
                    contentNode.contentEditable = "true";
                    contentNode.setAttribute("placeholder", "Click to type paragraph content...");
                    contentNode.innerHTML = b.v1 || "";
                    contentNode.addEventListener("input", (e) => (b.v1 = e.target.innerHTML));
                } else if (b.type === "h2") {
                    contentNode = document.createElement("h2");
                    contentNode.className = "wysiwyg-editor";
                    contentNode.contentEditable = "true";
                    contentNode.setAttribute("placeholder", "Header 2");
                    contentNode.innerHTML = b.v1 || "";
                    contentNode.addEventListener("input", (e) => (b.v1 = e.target.innerHTML));
                } else if (b.type === "h3") {
                    contentNode = document.createElement("h3");
                    contentNode.className = "wysiwyg-editor";
                    contentNode.contentEditable = "true";
                    contentNode.setAttribute("placeholder", "Header 3");
                    contentNode.innerHTML = b.v1 || "";
                    contentNode.addEventListener("input", (e) => (b.v1 = e.target.innerHTML));
                } else if (b.type === "img") {
                    contentNode = document.createElement("div");
                    contentNode.className = "image-block-editor";

                    contentNode.innerHTML = `
                        <div class="input-with-btn">
                            <input type="text" placeholder="Paste Image URL or upload..." value="${b.url || ""}" class="txtarea img-url-input" style="flex-grow:1;" />
                            <button class="action-btn btn upload-btn" title="Upload Image"><i class="bi bi-upload"></i> Upload</button>
                        </div>
                        <input type="text" placeholder="Alt text (optional)" value="${b.alt || ""}" class="txtarea img-alt-input" />
                        <div class="img-preview" style="text-align:center; background:rgba(0,0,0,0.2); padding:10px; border-radius:4px; min-height:60px; display:flex; align-items:center; justify-content:center;">
                            ${b.url ? `<img src="${b.url}" alt="${b.alt || ""}" style="max-width:100%; max-height:300px; object-fit:contain; border-radius:4px;" />` : `<span style="color:#888; font-size:12px; font-style:italic;">No Image URL Provided</span>`}
                        </div>
                    `;

                    const urlInput = contentNode.querySelector(".img-url-input");
                    const altInput = contentNode.querySelector(".img-alt-input");
                    const uploadBtn = contentNode.querySelector(".upload-btn");

                    urlInput.addEventListener("input", (e) => {
                        b.url = e.target.value;
                        const preview = contentNode.querySelector(".img-preview");
                        preview.innerHTML = b.url
                            ? `<img src="${b.url}" alt="${b.alt || ""}" style="max-width:100%; max-height:300px; object-fit:contain; border-radius:4px;" />`
                            : `<span style="color:#888; font-size:12px; font-style:italic;">No Image URL Provided</span>`;
                    });

                    altInput.addEventListener("input", (e) => {
                        b.alt = e.target.value;
                    });

                    uploadBtn.addEventListener("click", (e) => {
                        e.stopPropagation();
                        handleUpload((publicUrl) => {
                            b.url = publicUrl;
                            renderEditor();
                        });
                    });
                } else if (b.type === "conversation") {
                    contentNode = document.createElement("div");
                    contentNode.className = "conversation wysiwyg-editor";
                    contentNode.contentEditable = "true";
                    contentNode.setAttribute("placeholder", "Enter dialogue or quote box text content...");
                    contentNode.innerHTML = b.v1 || "";
                    contentNode.addEventListener("input", (e) => (b.v1 = e.target.innerHTML));
                } else if (b.type === "hr") {
                    contentNode = document.createElement("hr");
                    contentNode.style.margin = "2rem 0";
                } else if (b.type === "ul") {
                    contentNode = document.createElement("ul");
                    contentNode.className = "wysiwyg-editor";
                    contentNode.contentEditable = "true";
                    contentNode.setAttribute("placeholder", "• Item 1 (Press shift+enter for new lines)");
                    contentNode.innerHTML = b.v1 || "<li></li>";
                    contentNode.addEventListener("input", (e) => (b.v1 = e.target.innerHTML));
                } else if (b.type === "html") {
                    contentNode = document.createElement("div");
                    contentNode.className = "html-block-container";
                    if (b.isEditingHtml) {
                        contentNode.innerHTML = `
                            <span class="html-badge">Editing Code</span>
                            <textarea class="html-editor-textarea" rows="8">${b.v1 || ""}</textarea>
                            <button onclick="toggleHtmlEdit(${b.id})" style="margin-top:8px; width:100%; font-size:11px; background:#222; color:#fff; border:1px solid #444; padding:6px; cursor:pointer;">Render Output</button>
                        `;
                        const txt = contentNode.querySelector("textarea");
                        txt.addEventListener("input", (e) => (b.v1 = e.target.value));
                    } else {
                        contentNode.innerHTML = `
                            <span class="html-badge">HTML Output</span>
                            <div>${b.v1 || "<p style='color:#666; font-style:italic;'>[Empty HTML Block - Click to Edit Code]</p>"}</div>
                            <button class="media-overlay-btn btn" onclick="toggleHtmlEdit(${b.id})" style="display:block; bottom: 8px; top:auto; transform:translateX(-50%);">Edit HTML Code</button>
                        `;
                    }
                } else if (b.type === "split") {
                    contentNode = document.createElement("div");
                    contentNode.className = "split-layout";

                    let gridCols = b.gridCols || "1fr 1fr";
                    if (b.ratio) {
                        if (b.ratio === "60-40") gridCols = "6fr 4fr";
                        else if (b.ratio === "40-60") gridCols = "4fr 6fr";
                        else if (b.ratio === "30-70") gridCols = "3fr 7fr";
                        else if (b.ratio === "70-30") gridCols = "7fr 3fr";

                        b.gridCols = gridCols;
                        delete b.ratio;
                    }

                    contentNode.style.display = "grid";
                    contentNode.style.gridTemplateColumns = gridCols;
                    contentNode.style.gap = "1.5rem";
                    contentNode.style.alignItems = "start";
                    contentNode.style.marginBottom = "1.5rem";

                    if (!b.columns) b.columns = [[], []];

                    b.columns.forEach((colArray, colIdx) => {
                        const isSelected =
                            activeTargetInfo &&
                            activeTargetInfo.splitId === b.id &&
                            activeTargetInfo.colIndex === colIdx;

                        const colDiv = document.createElement("div");
                        colDiv.className = `nested-column ${isSelected ? "selected-column" : ""}`;
                        colDiv.onclick = (e) => selectColumn(b.id, colIdx, e);

                        colArray.forEach((nestedBlock) => {
                            colDiv.appendChild(buildBlockElement(nestedBlock, colArray));
                        });

                        contentNode.appendChild(colDiv);
                    });
                }

                if (contentNode) {
                    contentNode.id = `block-content-${b.id}`;
                    applyStylesToElement(contentNode, b.styles);
                    wrapper.appendChild(contentNode);
                }

                return wrapper;
            }

            function renderEditor() {
                const container = document.getElementById("blocks-container");
                container.innerHTML = "";

                blocks.forEach((b) => {
                    const blockEl = buildBlockElement(b, blocks);
                    container.appendChild(blockEl);
                });
            }

            function compileHTML(targetBlocks = blocks) {
                let html = "";
                if (targetBlocks === blocks) {
                    const title = document.getElementById("canvas-title").innerText || "Article Title";
                    const date = document.getElementById("canvas-date").innerText || "Publication Date";
                    html += `<h1>${title}</h1>\n<p><em>${date}</em></p>\n`;
                }

                targetBlocks.forEach((b) => {
                    const styleStr = getBlockStyleString(b);
                    if (b.type === "p" && b.v1) {
                        html += `<p${styleStr}>${b.v1}</p>\n`;
                    } else if (b.type === "h2" && b.v1) {
                        html += `<h2${styleStr}>${b.v1}</h2>\n`;
                    } else if (b.type === "h3" && b.v1) {
                        html += `<h3${styleStr}>${b.v1}</h3>\n`;
                    } else if (b.type === "img" && b.url) {
                        html += `<figure${styleStr}><img src="${b.url}" alt="${b.alt || ""}" style="max-width:100%; height:auto; border-radius: 6px;" /></figure>\n`;
                    } else if (b.type === "conversation" && b.v1) {
                        html += `<div class="conversation"${styleStr}>\n${b.v1}\n</div>\n`;
                    } else if (b.type === "hr") {
                        html += `<hr${styleStr}>\n`;
                    } else if (b.type === "html" && b.v1) {
                        html += `${b.v1}\n`;
                    } else if (b.type === "ul" && b.v1) {
                        html += `<ul${styleStr}>\n${b.v1}\n</ul>\n`;
                    } else if (b.type === "split") {
                        let gridCols = b.gridCols || "1fr 1fr";

                        if (b.ratio) {
                            if (b.ratio === "60-40") gridCols = "6fr 4fr";
                            else if (b.ratio === "40-60") gridCols = "4fr 6fr";
                            else if (b.ratio === "30-70") gridCols = "3fr 7fr";
                            else if (b.ratio === "70-30") gridCols = "7fr 3fr";
                        }

                        html += `<div class="split-layout" style="display: grid; grid-template-columns: ${gridCols}; gap: 1.5rem; margin-bottom: 1.5rem; align-items: start;"${styleStr}>\n`;
                        (b.columns || []).forEach((colBlocks) => {
                            html += `  <div>\n${compileHTML(colBlocks)}  </div>\n`;
                        });
                        html += `</div>\n`;
                    }
                });
                return html;
            }

            async function publishToSupabase() {
                if (!(await ensureAuthenticated())) return;

                const tag = document.getElementById("article-tag").value;
                const btn = document.getElementById("publish-btn");

                if (!tag) {
                    alert("A Unique Article Tag is required.");
                    return;
                }

                btn.innerText = "SAVING DATA...";
                btn.disabled = true;

                const compiledOutput = compileHTML();

                const { error } = await supabaseClient.from("blogs").upsert(
                    {
                        tag: tag,
                        title: document.getElementById("canvas-title").innerText,
                        description: document.getElementById("short-desc").value,
                        date: document.getElementById("canvas-date").innerText,
                        thumbnail_url: document.getElementById("thumb-url").value,
                        content: compiledOutput,
                        raw_json: blocks
                    },
                    { onConflict: "tag" }
                );

                if (error) {
                    alert("Error saving article: " + error.message);
                } else {
                    alert("Article successfully synced!");
                    toggleSettingsModal();
                }

                btn.innerText = "SAVE";
                btn.disabled = false;
            }

            function normalizeLegacyBlocks(rawBlocks) {
                return rawBlocks.map((b) => {
                    if (b.type === "thought") {
                        return {
                            id: b.id || Date.now(),
                            type: "split",
                            gridCols: "1fr 1fr",
                            columns: [[createNewBlockObject("p", b.v1)], [createNewBlockObject("img", "", b.v2, b.v3)]]
                        };
                    }
                    if (b.type === "split" && !b.columns) {
                        const col1 =
                            b.col1?.type === "image"
                                ? createNewBlockObject("img", "", b.col1.value)
                                : createNewBlockObject("p", b.col1?.value || "");
                        const col2 =
                            b.col2?.type === "image"
                                ? createNewBlockObject("img", "", b.col2.value)
                                : createNewBlockObject("p", b.col2?.value || "");

                        let legacyGrid = "1fr 1fr";
                        if (b.ratio) {
                            if (b.ratio === "60-40") legacyGrid = "6fr 4fr";
                            else if (b.ratio === "40-60") legacyGrid = "4fr 6fr";
                            else if (b.ratio === "30-70") legacyGrid = "3fr 7fr";
                            else if (b.ratio === "70-30") legacyGrid = "7fr 3fr";
                        }

                        return {
                            id: b.id || Date.now(),
                            type: "split",
                            gridCols: legacyGrid,
                            columns: [[col1], [col2]]
                        };
                    }
                    return b;
                });
            }

            window.onload = async () => {
                const urlParams = new URLSearchParams(window.location.search);
                const editTag = urlParams.get("edit");

                if (editTag) {
                    const { data } = await supabaseClient.from("blogs").select("*").eq("tag", editTag).single();
                    if (data) {
                        document.getElementById("article-tag").value = data.tag;
                        document.getElementById("canvas-title").innerText = data.title || "";
                        document.getElementById("canvas-date").innerText = data.date || "";
                        document.getElementById("thumb-url").value = data.thumbnail_url || "";
                        document.getElementById("short-desc").value = data.description || "";

                        if (data.raw_json && Array.isArray(data.raw_json)) {
                            blocks = normalizeLegacyBlocks(data.raw_json);
                            renderEditor();
                        } else {
                            blocks = [];
                            addBlock("p");
                        }
                    }
                } else {
                    addBlock("p");
                }
            };
        </script>
    </body>
</html>
